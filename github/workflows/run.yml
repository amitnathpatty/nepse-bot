name: NEPSE Pro-Trader Bot Master

on:
  # NEPSE Trading Days (Sunday - Thursday NPT):
  # 1. Pre-Open Intraday Setup: 10:45 AM NPT (05:00 UTC)
  - cron: '0 5 * * 0-4'
  # 2. Mid-Market Momentum Check: 01:00 PM NPT (07:15 UTC)
  - cron: '15 7 * * 0-4'
  # 3. Market Close & Portfolio Exit Review: 03:30 PM NPT (09:45 UTC)
  - cron: '45 9 * * 0-4'

  workflow_dispatch:

# GitHub Actions लाई data.json commit गर्न Write Permission अनिवार्य:
permissions:
  contents: write

jobs:
  run-nepse-ai:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas openai

      - name: Run Pro-Trader AI Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NAASA_EMAIL: ${{ secrets.NAASA_EMAIL }}
          NAASA_PASSWORD: ${{ secrets.NAASA_PASSWORD }}
        run: |
          python main.py

      - name: Commit and Push updated data.json
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update NEPSE Pro-Trader data.json"
          file_pattern: data.json
